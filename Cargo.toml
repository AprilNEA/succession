[package]
name = "succession"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AprilNEA/succession"
authors = ["AprilNEA <dev@aprilnea.me>"]
description = "Orderly succession for single-instance helper processes: an advisory lock plus an identity record binds a helper to one run of its owner, so one orphaned by a restart can be recognized and asked to leave."
readme = "README.md"
keywords = ["single-instance", "process", "lock", "orphan", "supervisor"]
categories = ["os", "filesystem"]

[features]
default = []
# Serialize the identity types, for an application that carries `Identity` on
# its own wire rather than only in the claim record.
serde = ["dep:serde"]
# Look live process facts up instead of making the caller supply them.
sysinfo = ["dep:sysinfo"]
# Terminate a superseded tenant, refusing to signal a pid that no longer
# belongs to the process the record describes.
eviction = ["sysinfo"]
# A supervision loop over the verdict: probe, spawn, wait, back off. std only.
supervision = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
sysinfo = { version = "0.38", default-features = false, features = [
    "system",
], optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
